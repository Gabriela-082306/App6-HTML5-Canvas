<body>
	<h1>HTML5 Canvas App</h1>


	<!-- Canvas where we will draw shapes, text, and images-->
	<canvas id="myCanvas"></canvas>

	<!--Buttons for different actions-->
	<button id="drawRectBtn">Draw Rectangle</button>
	<button id="drawNameBtn">Draw Name</button>
	<button id="loadImageBtn">Load Image</button>
	<button id="clearCanvasBtn">Clear Canvas</button>


	<script src="app.js"></script>
</body>
</html>

	<script>
	// Get the canvas and the context to draw on the canvas.
		const canvas = document.getElementById('myCanvas');
		const ctx = canvas.getContext('2d');
	</script>

<script>
	// Set canvas size to fit the screen width
	canvas.width = window.innerWidth;
	canvas.height = 300;
</script>


	<script>
		document.getElementById('drawRectBtn').addEventListener('click', function() 
		ctx.fillStyle = 'blue';
		ctx.fillRect(50, 50, 200, 100);
	</script>

<script>
	document.getElementById('drawNameBtn').addEventListener('click', function()
	ctx.font = '30px Arial';
	ctx.fillStyle = 'black';
	ctx.fillText('Your Name', 100, 200); 
</script>

	<script>
		document.getElementById('loadImageBtn').addEventListener('click', function()
		let img = new Image();
		img.src = 'cellular-microscopic-dna.jpg';
		img.onload = function()
		ctx.drawImage(img, 250, 50, 150, 150);
	</script>

<script>
	document.getElementById('clearCanvasBtn').addEventListener('click',function()
	ctx.clearRect(0, 0, canvas.width, canvas.height);
</script>
